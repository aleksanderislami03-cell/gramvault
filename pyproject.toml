[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gramvault"
version = "0.1.0"
description = "Private, local-first library for saved Instagram content with AI chat (RAG) and Obsidian export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GramVault contributors" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "chromadb>=0.5",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "typer>=0.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Dev/test tooling. Install with: pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
gramvault = "gramvault.cli:main"

# --- setuptools: package lives under backend/, package name is "gramvault" ---
[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["gramvault*"]

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

# --- ruff ---
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501", # line length is handled by the formatter / not worth blocking on for stubs
]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/File()/Query() and typer's Argument()/Option() are
# meant to be used as call-in-default-argument — that's the idiom for both
# frameworks, not a bug.
"backend/gramvault/api/*.py" = ["B008"]
"backend/gramvault/cli.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["gramvault"]
