# GramVault configuration template.
#
# Copy this file to `config.yaml` (already done for you in a fresh checkout —
# config.yaml ships with the same defaults) and adjust paths/models to taste.
# Every path below is relative to the current working directory unless it is
# absolute. Nothing in the codebase should ever hardcode a path — everything
# flows through this file (see backend/gramvault/config.py).
#
# All values can be overridden with environment variables using a
# double-underscore delimiter for nesting, e.g.:
#   GRAMVAULT_SERVER__PORT=9000
#   GRAMVAULT_PATHS__LIBRARY_DIR=/mnt/data/library

paths:
  # Where imported media (photos/videos) is stored after unpacking an export.
  library_dir: "./library"
  # SQLite database file (authors, items, media_files, tags, jobs, chat...).
  db_path: "./data/gramvault.db"
  # ChromaDB persistent vector store directory.
  chroma_dir: "./data/chroma"
  # Obsidian vault to export Markdown notes into. Null until the user
  # configures one; Agent A6 (Obsidian exporter) should refuse to run if unset.
  obsidian_vault_dir: null

models:
  # Ollama model names — referenced by name only, never called from this
  # scaffold. Agents A3 (AI pipeline) / A4 (chat) own the actual calls.
  chat_model: "llama3.1:8b"
  vision_model: "llava:7b"
  embedding_model: "nomic-embed-text"

ollama:
  # Base URL for the Ollama server. Defaults to the standard local install.
  host: "http://localhost:11434"

chunking:
  # Text chunking parameters for embeddings (captions, transcripts, notes).
  chunk_size: 512
  chunk_overlap: 64

video:
  # ffmpeg keyframe extraction settings for videos/reels.
  keyframe_interval_seconds: 5
  max_keyframes: 6

server:
  host: "127.0.0.1"
  port: 8000
